# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g focus-events on

# Mouse
set -g mouse on
setw -g mode-keys vi
# 256 colors / truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB,st-256color:RGB"
# Clipboard
set -g set-clipboard on
# History
set -g history-limit 10000
# Faster escape
set -sg escape-time 10
# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
# Don't rename windows automatically
set -g allow-rename off

# Status (misma paleta que la barra de qtile)
set -g status-position top
set -g status-interval 5
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#e6c384"
set -g status-justify centre
set -g status-style "bg=#141414,fg=#555555"
set -g window-status-style "fg=#555555"
set -g window-status-current-style "fg=#e8e8e8"
set -g window-status-separator "   "
set -g status-left-length 40
set -g status-right-length 60
set -g status-left " #{?client_prefix,#[fg=#e46876],#[fg=#1270a8]}#[bold]#S#[nobold]  #[fg=#555555]#{window_panes}p"
set -g status-right "#[fg=#555555]#H "
set -g window-status-format "#I #[fg=#777777]#W#{?window_zoomed_flag,#[fg=#1270a8] Z,}"
set -g window-status-current-format "#[fg=#1270a8][#I #[fg=#e8e8e8,bold]#W#{?window_zoomed_flag,#[fg=#1270a8] Z,}#[fg=#1270a8,nobold]]"

# Bordes, mensajes y selección
set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#1270a8"
set -g message-style "bg=#2a2a2a,fg=#e8e8e8"
set -g mode-style "bg=#1270a8,fg=#e8e8e8"

# Splits y ventanas nuevas en el directorio del panel actual
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Popups
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind s display-popup -E -w 50% -h 50% "tmux list-sessions -F '#S' | fzf --reverse --prompt 'session> ' | xargs -r tmux switch-client -t"

# Copiar en modo vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Al cerrar una ventana se renumeran las demás
set -g renumber-windows on

# Recargar config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Moverse entre paneles
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar paneles (repetible)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
