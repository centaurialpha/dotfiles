# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g focus-events on

# Mouse
set -g mouse on
setw -g mode-keys vi
# 256 colors / truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
# Clipboard
set -g set-clipboard on
# History
set -g history-limit 10000
# Faster escape
set -sg escape-time 10
# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
# Don't rename windows automatically
set -g allow-rename off

# Status (misma paleta que la barra de qtile)
set -g status-position top
set -g status-style "bg=#141414,fg=#555555"

set -g status-left "#[fg=#957fb8,bold] #S #[default]"
set -g status-left-length 30

set -g status-right "%H:%M "

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#e8e8e8,bold] #I:#W "

# Bordes, mensajes y selección
set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#957fb8"
set -g message-style "bg=#2a2a2a,fg=#e8e8e8"
set -g mode-style "bg=#957fb8,fg=#0a0a0a"

# Splits y ventanas nuevas en el directorio del panel actual
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copiar en modo vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Al cerrar una ventana se renumeran las demás
set -g renumber-windows on

# Recargar config
bind r source-file ~/.tmux.conf \; display "tmux.conf recargado"

# Moverse entre paneles
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
