# qtile bar palette, only overrides what differs from yazi's default theme

[mgr]
cwd = { fg = "#e8e8e8", bold = true }

find_keyword  = { fg = "#c0a36e", bold = true, underline = true }
find_position = { fg = "#957fb8", bold = true }

marker_copied   = { fg = "#98bb6c", bg = "#98bb6c" }
marker_cut      = { fg = "#e46876", bg = "#e46876" }
marker_marked   = { fg = "#8ea4a2", bg = "#8ea4a2" }
marker_selected = { fg = "#c0a36e", bg = "#c0a36e" }

count_copied   = { fg = "#0a0a0a", bg = "#98bb6c" }
count_cut      = { fg = "#0a0a0a", bg = "#e46876" }
count_selected = { fg = "#0a0a0a", bg = "#c0a36e" }

border_symbol = "│"
border_style  = { fg = "#2a2a2a" }

# Tabs styled like qtile's GroupBox
[tabs]
active    = { fg = "#e8e8e8", bg = "#1270a8", bold = true }
inactive  = { fg = "#555555", bg = "#2a2a2a" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# Status bar like qtile's: only mode and position go in blocks
[mode]
normal_main = { fg = "#e8e8e8", bg = "#1270a8", bold = true }
normal_alt  = { fg = "#e8e8e8" }
select_main = { fg = "#0a0a0a", bg = "#c0a36e", bold = true }
select_alt  = { fg = "#c0a36e" }
unset_main  = { fg = "#0a0a0a", bg = "#e46876", bold = true }
unset_alt   = { fg = "#e46876" }

# Hovered file in a blue block, its folder grey in the other columns
[indicator]
parent  = { fg = "#e8e8e8", bg = "#2a2a2a" }
current = { fg = "#e8e8e8", bg = "#1270a8" }
preview = { fg = "#e8e8e8", bg = "#2a2a2a" }
# Blue padding blocks, a plain space stays uncolored and glues the highlight to the icon
padding = { open = "█", close = "█" }

[status]
# Same gap as between qtile widgets
sep_left  = { open = "", close = " " }
sep_right = { open = " ", close = "" }

perm_sep   = { fg = "#555555" }
perm_type  = { fg = "#98bb6c" }
perm_read  = { fg = "#c0a36e" }
perm_write = { fg = "#e46876" }
perm_exec  = { fg = "#8ea4a2" }

progress_label  = { fg = "#e8e8e8", bold = true }
progress_normal = { fg = "#98bb6c", bg = "#2a2a2a" }
progress_error  = { fg = "#0a0a0a", bg = "#e46876" }

# Popups with qtile's blue menu border
[which]
border          = { fg = "#2a2a2a" }
cand            = { fg = "#8ea4a2" }
rest            = { fg = "#555555" }
desc            = { fg = "#957fb8" }
separator_style = { fg = "#555555" }

[confirm]
border  = { fg = "#2a2a2a" }
title   = { fg = "#e8e8e8", bold = true }
btn_yes = { fg = "#e8e8e8", bg = "#1270a8" }

[spot]
border   = { fg = "#2a2a2a" }
title    = { fg = "#e8e8e8", bold = true }
tbl_col  = { fg = "#8ea4a2" }
tbl_cell = { fg = "#e8e8e8", bg = "#2a2a2a" }

[notify]
title_info  = { fg = "#98bb6c" }
title_warn  = { fg = "#c0a36e" }
title_error = { fg = "#e46876" }

[pick]
border = { fg = "#2a2a2a" }
active = { fg = "#e8e8e8", bg = "#1270a8", bold = true }

[input]
border   = { fg = "#2a2a2a" }
selected = { fg = "#e8e8e8", bg = "#1270a8" }

[cmp]
border = { fg = "#2a2a2a" }
active = { fg = "#e8e8e8", bg = "#1270a8" }

[tasks]
border  = { fg = "#2a2a2a" }
hovered = { fg = "#e8e8e8", bg = "#1270a8", bold = true }

[help]
border  = { fg = "#2a2a2a" }
chord   = { fg = "#8ea4a2" }
hovered = { fg = "#e8e8e8", bg = "#1270a8", bold = true }

# Replaces the default theme's list entirely
[filetype]
rules = [
	{ mime = "**/image/*", fg = "#c0a36e" },
	{ mime = "**/{audio,video}/*", fg = "#957fb8" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e46876" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8ea4a2" },
	{ mime = "vfs/{absent,stale}", fg = "#555555" },
	{ url = "*", is = "orphan", fg = "#e46876", italic = true },
	{ url = "*", is = "exec", fg = "#98bb6c" },
	{ url = "*", is = "dummy", fg = "#e46876", italic = true },
	{ url = "*/", is = "dummy", fg = "#e46876", italic = true },
	{ url = "*/", fg = "#7fb4ca", bold = true },
]
