<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>start</title>
<link rel="stylesheet" href="start.css">
</head>
<body>
<main>
  <h1>qutebrowser</h1>
  <ul>
    <li><a href="https://github.com">github <span>github.com</span></a></li>
    <li><a href="https://www.youtube.com">youtube <span>youtube.com</span></a></li>
    <li><a href="https://wiki.archlinux.org">arch wiki <span>wiki.archlinux.org</span></a></li>
    <li><a href="https://docs.python.org/3/">python docs <span>docs.python.org</span></a></li>
    <li><a href="http://beszel.home">beszel <span>beszel.home</span></a></li>
    <li><a href="http://uptime.home">hemara status <span>uptime.home</span></a></li>
    <li><a href="https://www.reddit.com/r/unixporn/">unixporn <span>r/unixporn</span></a></li>
  </ul>
</main>
<div id="groups"></div>
<!-- bookmarks.js is written by config.py from bookmarks/urls and not versioned -->
<script src="bookmarks.js"></script>
<script>
  const groups = document.getElementById("groups");
  for (const [name, links] of Object.entries(window.BOOKMARKS ?? {})) {
    const panel = document.createElement("section");
    panel.className = "panel";
    const title = document.createElement("h1");
    title.textContent = name;
    const list = document.createElement("ul");
    for (const { url, title: text } of links) {
      const link = document.createElement("a");
      link.href = url;
      link.textContent = text;
      link.title = text;
      const item = document.createElement("li");
      item.append(link);
      list.append(item);
    }
    panel.append(title, list);
    groups.append(panel);
  }
</script>
</body>
</html>
